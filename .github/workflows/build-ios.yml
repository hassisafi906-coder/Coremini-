name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install iOS Workload
      run: dotnet workload install ios

    - name: Configure Project for iOS Only
      run: |
        cat << 'EOT' > ui-desktop.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0-ios</TargetFramework>
            <SupportedOSPlatformVersion>14.2</SupportedOSPlatformVersion>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <CheckEolTargetFramework>false</CheckEolTargetFramework>
            <AssemblyName>CoreminiApp</AssemblyName>
            <RootNamespace>CoreminiApp</RootNamespace>
            <ApplicationId>com.coremini.app</ApplicationId>
            <EnableCodeSigning>false</EnableCodeSigning>
            <_RequireCodeSigning>false</_RequireCodeSigning>
          </PropertyGroup>
        </Project>
        EOT

    - name: Restore Dependencies
      run: dotnet restore ui-desktop.csproj /p:CheckEolTargetFramework=false

    - name: Build iOS App
      run: |
        dotnet build ui-desktop.csproj \
          -c Release \
          -f net10.0-ios \
          /p:CheckEolTargetFramework=false \
          /p:BuildIpa=true \
          /p:EnableCodeSigning=false \
          /p:_RequireCodeSigning=false

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-iOS-IPA
        path: |
          **/bin/Release/net10.0-ios/*/*.ipa
          **/*.ipa
          **/*.app
