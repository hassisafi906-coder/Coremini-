name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install iOS Workload
      run: dotnet workload install ios

    - name: Restore Dependencies
      run: dotnet restore ui-desktop.csproj /p:CheckEolTargetFramework=false

    - name: Build iOS App
      run: |
        dotnet build ui-desktop.csproj \
          -c Release \
          -f net10.0-ios \
          /p:CheckEolTargetFramework=false \
          /p:BuildIpa=true

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-iOS-IPA
        path: |
          **/bin/Release/net10.0-ios/*/*.ipa
          **/*.ipa
          **/*.app
