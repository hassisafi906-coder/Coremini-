name: Build Coremini App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI/Android Workload
      run: dotnet workload install maui-android android

    - name: Build and Publish Android APK
      run: |
        dotnet publish \
          -c Release \
          -f net10.0-android \
          -r android-arm64 \
          /p:OutputType=Exe \
          /p:CheckEolTargetFramework=false \
          /p:AndroidPackageFormat=apk \
          /p:AndroidCreatePackagePerAbi=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-Android-APK
        path: |
          **/bin/Release/*/*/*.apk
          **/bin/Release/*/*.apk
          **/*.apk
