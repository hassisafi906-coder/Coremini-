name: Build Coremini App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Restore Dependencies
      run: dotnet restore ui-desktop.csproj -r android-arm64 /p:CheckEolTargetFramework=false

    - name: Build and Publish Android APK
      run: |
        dotnet build ui-desktop.csproj \
          -c Release \
          -f net10.0-android \
          -r android-arm64 \
          /p:CheckEolTargetFramework=false \
          /p:AndroidPackageFormat=apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-Android-APK
        path: |
          **/bin/Release/net10.0-android/*/*.apk
          **/bin/Release/net10.0-android/*.apk
          **/*.apk
