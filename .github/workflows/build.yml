name: Build Coremini App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI/Android Workload
      run: dotnet workload install maui-android android

    - name: Restore Dependencies for Android
      run: dotnet restore -p:TargetFrameworks=net10.0-android

    - name: Build Project for Android
      run: dotnet publish -c Release -f net10.0-android --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-Android-APK
        path: |
          bin/Release/*/*/*.apk
          bin/Release/*/*.apk
