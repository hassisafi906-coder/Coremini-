name: Build Coremini App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI/Android Workload
      run: dotnet workload install maui-android android

    - name: Restore Dependencies
      run: dotnet restore ui-desktop/ui-desktop.csproj

    - name: Build Project for Android
      run: dotnet publish ui-desktop/ui-desktop.csproj -c Release -f net8.0-android --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coremini-Android-APK
        path: |
          ui-desktop/bin/Release/*/*/*.apk
          ui-desktop/bin/Release/*/*.apk
